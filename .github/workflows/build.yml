name: Build installers

# Push a tag like v0.1.0 (or run manually) and this builds a double-click installer
# for Windows (.exe), macOS (.dmg) and Linux (.AppImage) on their native runners,
# then attaches them to a GitHub Release. No local build machine needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # bundled explicitly in the next step

      # Download THIS platform's Chromium (+ headless shell + ffmpeg) into pw-browsers so
      # extraResources bundles it into the installer — no fragile first-run download for
      # end users on restricted networks.
      - name: Bundle Chromium
        run: node node_modules/playwright-core/cli.js install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

      - name: Build
        run: npx electron-builder --publish never
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'    # unsigned build (internal distribution)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kateb-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
